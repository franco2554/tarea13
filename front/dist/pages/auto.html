<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del auto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">Gestión de autos</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="../../index.html">Listado</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">

        <div id="alertaNoEncontrado" class="alert alert-warning d-none">
            No se encontró el auto.
        </div>

        <h1 class="h3 mb-4" id="tituloAuto">Datos del auto</h1>

        <div class="row">

            <div class="col-12 col-lg-5 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Información</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><strong>Marca:</strong> <span id="infoMarca"></span></li>
                            <li class="list-group-item"><strong>Modelo:</strong> <span id="infoModelo"></span></li>
                            <li class="list-group-item"><strong>Año:</strong> <span id="infoAnio"></span></li>
                            <li class="list-group-item"><strong>Precio:</strong> <span id="infoPrecio"></span></li>
                            <li class="list-group-item"><strong>Estado:</strong> <span id="infoEstado"></span></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-7">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Modificar datos</h5>

                        <div id="alertaGuardado" class="alert alert-success d-none">
                            Los datos fueron modificados correctamente.
                        </div>

                        <form id="formAuto">
                            <div class="mb-3">
                                <label for="marca" class="form-label">Marca</label>
                                <select class="form-select" id="marca">
                                    <option value="" selected disabled>Seleccionar marca...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="modelo" class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="modelo">
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="anio" class="form-label">Año</label>
                                    <input type="number" class="form-control" id="anio">
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="estado" class="form-label">Estado</label>
                                    <select class="form-select" id="estado">
                                        <option value="Nuevo">Nuevo</option>
                                        <option value="Usado">Usado</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio (USD)</label>
                                <input type="number" step="0.01" class="form-control" id="precio">
                            </div>
                            <button type="submit" class="btn btn-primary">Guardar cambios</button>
                            <a href="../../index.html" class="btn btn-outline-secondary">Volver al listado</a>
                        </form>

                    </div>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auto.js"></script>
</body>
</html>
